name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        working-directory: python-app
        run: pip install -r requirements.txt

      - name: Lancer les tests
        working-directory: python-app
        run: pytest -v

  node:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        working-directory: node-app
        run: npm ci

      - name: Lancer les tests
        working-directory: node-app
        run: npm test

  java:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compiler et tester
        working-directory: java-app
        run: mvn -B package

  php:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, dom, mbstring, curl

      - name: Installer les dépendances
        working-directory: php-app
        run: composer install --no-interaction

      - name: Lancer les tests
        working-directory: php-app
        run: vendor/bin/phpunit tests
